# Secret-scanning configuration.
#
# The baseline rules are inherited in full. Only individually-justified findings are
# allowlisted, by fingerprint, never by disabling a rule: switching off
# generic-api-key to silence one type annotation would also switch off the detection
# that catches a real key pasted into the same file.

[extend]
useDefault = true

[[rules]]
# Keep the default generic-api-key rule, with a narrow allowlist attached.
id = "generic-api-key"
description = "Generic API key"
regex = '''(?i)(?:key|api|token|secret|client|passwd|password|auth|access)(?:[0-9a-z\-_\t .]{0,20})(?:[\s|']|[\s|"]){0,3}(?:=|>|:{1,3}=|\|\||:|<=|=>|:=)(?:'|\"|\s|=|\x60){0,5}([0-9a-z\-_.=]{10,150})(?:['|\"|\n|\r|\s|\x60|;]|$)'''
entropy = 3.5
keywords = ["key", "api", "token", "secret", "client", "passwd", "password", "auth", "access"]

[rules.allowlist]
regexTarget = "line"
regexes = [
  # `def public_key_hex(key: Ed25519PrivateKey | None = None)` — the match is the
  # Ed25519 *type name* in a signature, which is high-entropy and not a secret. The
  # signing key itself is read from SETU_EVIDENCE_SIGNING_KEY or generated at runtime;
  # it is never literal in source, and the development key file is gitignored.
  '''def public_key_hex\(key: Ed25519PrivateKey''',
]
