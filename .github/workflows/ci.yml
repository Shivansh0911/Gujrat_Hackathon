name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default. Jobs that need more request it explicitly.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  quality:
    name: Lint, types, tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the secret scan can examine every commit, not just the tip.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Lint
        run: |
          ruff check backend/services backend/scripts backend/tests
          ruff format --check services scripts tests

      - name: Type check (strict)
        run: mypy --strict services

      - name: Declared-FPS guard
        # §2.2's "never trust the reported frame rate" enforced as an exact count, so a
        # future commit cannot add a second read and paste the marker to stay green.
        run: python backend/scripts/check_fps_guard.py

      - name: Tests
        # Unit tests must not touch the network: the gateway is third-party
        # infrastructure and a red build caused by their outage teaches us nothing.
        run: pytest backend/tests -q --cov=services --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          retention-days: 30

  security:
    name: Dependency audit, secrets, SBOM
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install audit tooling
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit==2.7.3 cyclonedx-bom==4.6.1

      - name: Dependency vulnerability audit
        run: pip-audit -r backend/requirements.txt --strict

      - name: Secret scan (full history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate CycloneDX SBOM
        run: |
          mkdir -p reports
          cyclonedx-py requirements backend/requirements.txt -o reports/sbom.json

      - name: Publish SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: reports/sbom.json
          retention-days: 90

  supply-chain:
    name: Container image pinning
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Every compose image must be digest-pinned
        # A floating tag means the stack a jury runs is not the stack we tested.
        run: python backend/scripts/pin_digests.py --check
