name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default. Jobs that need more request it explicitly.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  quality:
    name: Lint, types, tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the secret scan can examine every commit, not just the tip.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      # Both steps run from `backend/`, which is where the Python tree lives and what
      # the Makefile targets do. Before the backend/frontend split these paths were
      # top-level; afterwards `ruff format --check services ...` and `mypy --strict
      # services` were pointing at directories that no longer existed at the root, so
      # the job failed on a missing path rather than on anything about the code.
      - name: Lint
        working-directory: backend
        run: |
          ruff check services scripts tests
          ruff format --check services scripts tests

      - name: Type check (strict)
        working-directory: backend
        run: mypy --strict services

      - name: Declared-FPS guard
        # §2.2's "never trust the reported frame rate" enforced as an exact count, so a
        # future commit cannot add a second read and paste the marker to stay green.
        run: python backend/scripts/check_fps_guard.py

      - name: Tests
        # Unit tests must not touch the network: the gateway is third-party
        # infrastructure and a red build caused by their outage teaches us nothing.
        run: pytest backend/tests -q --cov=services --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          retention-days: 30

  security:
    name: Dependency audit, secrets, SBOM
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install audit tooling
        run: |
          python -m pip install --upgrade pip
          # Versions must match backend/requirements-dev.txt, which is the single
          # source of truth. Installed explicitly rather than from that file so this
          # job does not pull onnxruntime and the ANPR models it does not need.
          pip install pip-audit==2.10.1 cyclonedx-bom==7.3.1

      - name: Dependency vulnerability audit
        # One advisory is suppressed, deliberately and specifically.
        #
        # PYSEC-2026-1325 / CVE-2024-23342 is a Minerva timing attack on P-256 in
        # `ecdsa`. Upstream considers side-channel attacks out of scope and states
        # there is no planned fix, so there is no version to upgrade to.
        #
        # We do not reach the affected code. `ecdsa` arrives only as a transitive
        # dependency of python-jose; our tokens are HS256 (symmetric HMAC) and our
        # evidence signing is Ed25519 through `cryptography`. Nothing in this tree
        # calls ECDSA signing, key generation or ECDH, and signature *verification*
        # is unaffected in any case.
        #
        # Suppressed by ID rather than by dropping --strict, so any *other* advisory
        # in any package still fails the build. Revisit by replacing python-jose with
        # PyJWT, which removes the dependency instead of excusing it -- see
        # SECURITY.md.
        run: pip-audit -r backend/requirements.txt --strict --ignore-vuln PYSEC-2026-1325

      - name: Secret scan (full history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate CycloneDX SBOM
        run: |
          mkdir -p reports
          cyclonedx-py requirements backend/requirements.txt -o reports/sbom.json

      - name: Publish SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: reports/sbom.json
          retention-days: 90

  supply-chain:
    name: Container image pinning
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Every compose image must be digest-pinned
        # A floating tag means the stack a jury runs is not the stack we tested.
        run: python backend/scripts/pin_digests.py --check
