# Netlify deployment for the SETU console.
#
# Netlify serves the built bundle as static files; the API and the database live
# elsewhere (Railway). Two things about that arrangement are not obvious.
#
# **The console talks to the API directly, not through a Netlify redirect.**
# Netlify's `status = 200` redirects proxy HTTP happily, and it is tempting to route
# /api that way so the browser stays same-origin. But they do not proxy WebSockets,
# and the alert desk's live feed is a WebSocket. Proxying HTTP while the socket
# quietly fails is the worst of both: the alert list still polls, so the page looks
# alive, and the only symptom is a status dot that never turns green. So the console
# is built with VITE_API_ORIGIN pointing at the API's own origin, and both the REST
# calls and the socket go straight there.
#
# **That makes it cross-origin, which means CORS is load-bearing.** The API must name
# this console's exact origin in SETU_CORS_ORIGINS. Never a wildcard: the console
# sends an Authorization header, and a wildcard origin with credentials is both
# refused by browsers and prohibited in SECURITY.md.

[build]
  base    = "frontend"
  publish = "dist"
  command = "npm ci && npm run build"

[build.environment]
  NODE_VERSION = "20"
  # Set VITE_API_ORIGIN in the Netlify UI (Site settings -> Environment variables)
  # to the API's public origin, e.g. https://setu-api.up.railway.app -- with no
  # trailing slash and no /api suffix. It is read at build time, not at runtime, so
  # changing it requires a redeploy.

# Client-side routing. /journey and /alerts do not exist on disk; without this a
# refresh on any route but / returns Netlify's 404 page, which is the single most
# common way a deployed React app looks broken to someone who did not build it.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=()"

# Vite fingerprints everything under /assets, so those are immutable. index.html
# must never be, or a redeploy leaves clients on the previous build indefinitely.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-store, must-revalidate"
