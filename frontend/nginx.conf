# Serves the console bundle and proxies the API.
#
# Two things here are not boilerplate:
#
#   * The SPA fallback. Client-side routes (/journey, /alerts) do not exist on disk;
#     without try_files a page refresh on any route but / returns 404, which is the
#     single most common way a deployed React app looks broken to someone who did
#     not build it.
#
#   * The CSP. It is written against what the console actually loads and was checked
#     by rendering the map and the video player, not by copying a template. MapLibre
#     compiles its style expressions with `new Function`, so 'unsafe-eval' is
#     required; hls.js decodes into blob: URLs; the basemap fetches raster tiles and
#     fonts from named hosts. A stricter CSP than this silently blanks the map.

#   * The listen port is templated. Railway (and Cloud Run, and Heroku) assign a
#     port at runtime through $PORT and route to that and nothing else; a hard-coded
#     8080 makes the console simply unreachable there, with healthy-looking logs.
#     PORT defaults to 8080 in the Dockerfile so compose and local runs are unchanged.

server {
    listen       ${PORT};
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Gzip the static bundle only. `gzip_proxied any` compressed API responses too,
    # and the Content-Encoding header did not survive the proxy, so clients received
    # raw gzip bytes labelled application/json and every JSON parse failed with
    # "Expecting value: line 1 column 1". The bundle is where gzip earns its keep;
    # API payloads here are small enough that correctness is worth more than the
    # saved kilobytes.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      off;
    gzip_types        text/plain text/css application/javascript
                      image/svg+xml application/wasm;

    add_header X-Content-Type-Options   "nosniff"            always;
    add_header X-Frame-Options          "DENY"               always;
    add_header Referrer-Policy          "no-referrer"        always;
    add_header Permissions-Policy       "camera=(), microphone=(), geolocation=()" always;
    # HSTS is set by the platform's TLS terminator in production; kept here so a
    # self-hosted deployment behind its own TLS gets it too.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # ONE LINE, deliberately. Written across several lines with backslash
    # continuations, nginx emits the backslash and the newline verbatim inside the
    # header value, producing a malformed HTTP header. Browsers tolerate it quietly;
    # the WebSocket handshake does not, and the alert feed fails with
    # `invalid HTTP header line` from a header that has nothing to do with sockets.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://tile.openstreetmap.org https://*.tile.openstreetmap.org; media-src 'self' blob: https:; connect-src 'self' blob: https://tile.openstreetmap.org https://*.tile.openstreetmap.org wss: ws: https:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # Hashed bundle filenames are immutable; index.html must never be cached or a
    # redeploy leaves clients on the previous build indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    location /api/ {
        gzip off;
        proxy_pass         http://${SETU_API_HOST}:${SETU_API_PORT}/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /media/ {
        gzip off;
        proxy_pass       http://${SETU_API_HOST}:${SETU_API_PORT}/media/;
        proxy_set_header Host $host;
        expires 1h;
    }

    # WebSocket for the alert feed. Without the Upgrade headers the handshake fails
    # and the alert desk falls back to polling with no visible error.
    location /ws/ {
        proxy_pass         http://${SETU_API_HOST}:${SETU_API_PORT}/ws/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Everything else is a client-side route.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
