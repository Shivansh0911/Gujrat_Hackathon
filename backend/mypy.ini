; Type-checking configuration.
;
; `make typecheck` and CI both run `mypy --strict services`. Strict mode is the point:
; this codebase carries evidence for a police investigation, and a silent None or a
; str where an enum belongs is the kind of defect that surfaces as a wrong plate on a
; report rather than as a crash.
;
; The per-module sections below exist because several dependencies ship no type
; information. Suppressing those is not the same as relaxing strictness on our own
; code -- `services.*` stays fully strict, and the ignores are listed one library at a
; time so that adding a new untyped dependency is a visible decision rather than a
; blanket `ignore_missing_imports = True` at the top.

[mypy]
python_version = 3.12
warn_unused_ignores = True
warn_redundant_casts = True
show_error_codes = True
; Keep our own modules honest even when they touch untyped libraries.
disallow_any_generics = True

; --- Untyped third-party libraries -------------------------------------------
; ONNX model packages. Both ship runtime-only wheels with no py.typed marker.
[mypy-open_image_models.*]
ignore_missing_imports = True

[mypy-fast_plate_ocr.*]
ignore_missing_imports = True

; OpenCV's stubs are partial and disagree with the runtime on ndarray unions.
[mypy-cv2.*]
ignore_missing_imports = True

; PDF generation for evidence export. No stubs published.
[mypy-reportlab.*]
ignore_missing_imports = True

; Geospatial helpers used by the registry.
[mypy-geoalchemy2.*]
ignore_missing_imports = True

[mypy-shapely.*]
ignore_missing_imports = True
