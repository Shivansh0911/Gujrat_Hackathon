# Project SETU — local development and demonstration stack.
#
# §0 forbids `latest`: a jury re-running this six weeks after submission must get the
# bytes we tested, not whatever a floating tag points at by then. Every image is
# therefore pinned to an exact version tag, and to an immutable digest wherever one
# has been resolved.
#
# DIGEST STATUS: postgres is digest-pinned. redis, minio and keycloak carry exact
# version tags only -- registry TLS handshakes were timing out when this file was
# written and fabricating a digest would be worse than omitting one. Run
# `make pin-digests` on a working connection to resolve and rewrite them in place;
# CI fails the build if any image here lacks a digest (see .github/workflows/ci.yml).
#
# Kafka is deliberately absent. See docs/adr/0001-event-bus-abstraction.md -- domain
# events flow through an interface whose shape is Kafka's, with an in-process backend
# at 30 cameras and a Kafka backend at statewide scale. The interface is the
# architecture; the broker is a deployment choice.

name: setu

services:
  # TimescaleDB's HA image is the only one carrying PostGIS, TimescaleDB AND pgvector
  # together. Assembling these from separate images means resolving extension/ABI
  # conflicts by hand at exactly the wrong moment.
  postgres:
    image: timescale/timescaledb-ha:pg16.4-ts2.17.2-oss@sha256:5df86141242ec2724bbabf5ee82b2480170a9d821bbbb7a77f8572aed84e9180
    container_name: setu-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-setu}
      POSTGRES_USER: ${POSTGRES_USER:-setu}
      # No default. An unset database password must fail the stack, not silently
      # start one reachable with a guessable credential.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      # scram-sha-256 for new connections; trust/md5 are not acceptable even locally,
      # because "it worked on the dev stack" is how weak auth reaches production.
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    ports:
      - "127.0.0.1:5432:5432"   # loopback only: never expose a database on 0.0.0.0
    volumes:
      - postgres_data:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-setu} -d ${POSTGRES_DB:-setu}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7.4.1-alpine  # digest pending: make pin-digests
    container_name: setu-redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
      --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    restart: unless-stopped
    user: "999:1000"
    security_opt:
      - no-new-privileges:true

  # Evidence store. S3-compatible so the production path is a bucket policy change,
  # not a code change.
  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z  # digest pending: make pin-digests
    container_name: setu-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set in .env}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  # Identity provider. RBAC and department scoping are enforced server-side against
  # tokens this issues; the console never makes an authorisation decision.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.5  # digest pending: make pin-digests
    container_name: setu-keycloak
    command: ["start-dev", "--import-realm", "--health-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?KEYCLOAK_ADMIN must be set in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD must be set in .env}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-setu}
      KC_DB_USERNAME: ${POSTGRES_USER:-setu}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      KC_DB_SCHEMA: keycloak
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./infra/keycloak/realm-setu.json:/opt/keycloak/data/import/realm-setu.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  redis_data:
  minio_data:
