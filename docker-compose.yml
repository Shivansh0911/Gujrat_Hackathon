# Project SETU â€” local development and demonstration stack.
#
# Â§0 forbids `latest`: a jury re-running this six weeks after submission must get the
# bytes we tested, not whatever a floating tag points at by then. Every image is
# therefore pinned to an exact version tag, and to an immutable digest wherever one
# has been resolved.
#
# DIGEST STATUS: every image here and in docker-compose.prod.yml is pinned to an
# immutable digest. `make pin-digests` resolves any newly added tag and rewrites in
# place; CI fails the build if an image lacks one (see .github/workflows/ci.yml).
# Digests come from `docker buildx imagetools`, so they are the OCI image index the
# tag resolves to -- `docker manifest inspect` can report a different, also-valid
# digest for the same tag, and mixing the two produces confusing diffs.
#
# Kafka is deliberately absent. See docs/adr/0001-event-bus-abstraction.md -- domain
# events flow through an interface whose shape is Kafka's, with an in-process backend
# at 30 cameras and a Kafka backend at statewide scale. The interface is the
# architecture; the broker is a deployment choice.

name: setu

services:
  # TimescaleDB's HA image is the only one carrying PostGIS, TimescaleDB AND pgvector
  # together. Assembling these from separate images means resolving extension/ABI
  # conflicts by hand at exactly the wrong moment.
  postgres:
    image: timescale/timescaledb-ha:pg16.4-ts2.17.2-oss@sha256:5df86141242ec2724bbabf5ee82b2480170a9d821bbbb7a77f8572aed84e9180
    container_name: setu-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-setu}
      POSTGRES_USER: ${POSTGRES_USER:-setu}
      # No default. An unset database password must fail the stack, not silently
      # start one reachable with a guessable credential.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      # scram-sha-256 for new connections; trust/md5 are not acceptable even locally,
      # because "it worked on the dev stack" is how weak auth reaches production.
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    ports:
      - "127.0.0.1:5432:5432"   # loopback only: never expose a database on 0.0.0.0
    volumes:
      - postgres_data:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-setu} -d ${POSTGRES_DB:-setu}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  # ---------------------------------------------------------------------------
  # PLANNED INFRASTRUCTURE â€” started only with `--profile planned`.
  #
  # Nothing in the codebase connects to any of the three services below. They are
  # here because the architecture calls for them, not because they are wired in.
  # They sit behind a profile so that `docker compose up` starts exactly what the
  # platform actually uses: a compose file that stands up Redis, an object store and
  # an identity provider implies a caching layer, S3 evidence storage and federated
  # auth, and a reader would be right to assume all three exist. They do not yet.
  # ---------------------------------------------------------------------------

  # Planned: cache and rate-limit backend. Not connected â€” the API holds no Redis
  # client and `redis` is not in requirements.txt.
  redis:
    profiles: ["planned"]
    image: redis:7.4.1-alpine@sha256:c1e88455c85225310bbea54816e9c3f4b5295815e6dbf80c34d40afc6df28275
    container_name: setu-redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
      --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    restart: unless-stopped
    user: "999:1000"
    security_opt:
      - no-new-privileges:true

  # Planned: evidence object store, S3-compatible so the production path would be a
  # bucket policy change rather than a code change. Not connected â€” evidence crops
  # are written to the filesystem under `data/evidence/crops` and served from there,
  # and there is no S3 client anywhere in the tree.
  minio:
    profiles: ["planned"]
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z@sha256:9535594ad4122b7a78c6632788a989b96d9199b483d3bd71a5ceae73a922cdfa
    container_name: setu-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set in .env}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  # Planned: identity provider (ADR pending). Not connected â€” `services/api/auth.py`
  # mints and verifies its own HS256 JWTs and does not talk to Keycloak. RBAC and
  # department scoping *are* enforced server-side and the console never makes an
  # authorisation decision, but the token issuer is the API itself, not this.
  keycloak:
    profiles: ["planned"]
    image: quay.io/keycloak/keycloak:26.0.5@sha256:089b5898cb0ba151224c83aef3806538582880029eb5ea71c2afd00b627d4907
    container_name: setu-keycloak
    command: ["start-dev", "--import-realm", "--health-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?KEYCLOAK_ADMIN must be set in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD must be set in .env}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-setu}
      KC_DB_USERNAME: ${POSTGRES_USER:-setu}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      KC_DB_SCHEMA: keycloak
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./infra/keycloak/realm-setu.json:/opt/keycloak/data/import/realm-setu.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  redis_data:
  minio_data:
